<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高年級電影真善美 RPG 冒險</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "MicroSoft JhengHei", sans-serif; }
        body { background-color: #2b2b2b; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #game-container {
            width: 800px;
            height: 600px;
            position: relative;
            background-size: cover;
            background-position: center;
            border: 4px solid #8b5a2b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* 標題與頂部UI */
        .header-ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .title-banner { height: 60px; }
        .stats-panel {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            font-weight: bold;
            font-size: 16px;
        }

        /* 戰鬥舞台 */
        .stage-area {
            height: 340px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 80px 20px 80px;
        }
        .sprite { height: 180px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }

        /* 答題區 */
        .quiz-panel {
            height: 250px;
            background: rgba(40, 30, 20, 0.95);
            border-top: 3px solid #d4af37;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .question-text { font-size: 18px; color: #fff8dc; line-height: 1.4; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-option {
            background: #4a3525;
            color: #fff;
            border: 2px solid #8b5a2b;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            transition: 0.2s;
        }
        .btn-option:hover { background: #6b4c35; border-color: #d4af37; }

        /* 商店與結算彈窗 */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .hidden { display: none !important; }
        .shop-items { display: flex; gap: 20px; margin: 20px 0; }
        .shop-card {
            background: #3a2a1a;
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            width: 160px;
        }
        .shop-card img { width: 60px; height: 60px; margin-bottom: 10px; }
        .btn-action {
            background: #d4af37; color: #000; font-weight: bold; border: none;
            padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-top: 10px;
        }
        .btn-action:hover { background: #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 頂部資訊列 -->
    <div class="header-ui">
        <img id="title-img" src="assets/backgrounds/title.png" alt="真善美" class="title-banner" onerror="this.style.display='none'">
        <div class="stats-panel">
            關卡: <span id="stage-num">1</span>/5 | 
            HP: <span id="hp-val">100</span> | 
            金幣: <span id="coin-val">0</span> | 
            復活符: <span id="revive-val">0</span>
        </div>
    </div>

    <!-- 戰鬥與角色區 -->
    <div class="stage-area">
        <img id="player-img" src="assets/characters/wizard.png" alt="魔法師" class="sprite">
        <img id="monster-img" src="assets/characters/wolf.png" alt="怪物" class="sprite">
    </div>

    <!-- 題庫問答區 -->
    <div class="quiz-panel">
        <div id="question-text" class="question-text">題目載入中...</div>
        <div id="options-grid" class="options-grid"></div>
    </div>

    <!-- 商店 Modal -->
    <div id="shop-modal" class="modal hidden">
        <h2>🎪 魔法冒險商店 🎪</h2>
        <p>打贏怪物獲勝！請補充整備後進入下一關。</p>
        <div class="shop-items">
            <div class="shop-card">
                <img src="assets/items/potion.png" alt="回血藥水">
                <h3>回血藥水</h3>
                <p>恢復 30 HP</p>
                <p>💰 20 金幣</p>
                <button class="btn-action" onclick="buyItem('potion')">購買</button>
            </div>
            <div class="shop-card">
                <img src="assets/items/crystal.png" alt="攻擊水晶">
                <h3>攻擊水晶</h3>
                <p>增加金幣收益</p>
                <p>💰 30 金幣</p>
                <button class="btn-action" onclick="buyItem('crystal')">購買</button>
            </div>
            <div class="shop-card">
                <img src="assets/items/scroll.png" alt="復活符">
                <h3>復活符</h3>
                <p>HP歸零時復活</p>
                <p>💰 50 金幣</p>
                <button class="btn-action" onclick="buyItem('revive')">購買</button>
            </div>
        </div>
        <button class="btn-action" style="font-size: 18px;" onclick="nextStage()">前往下一關</button>
    </div>

    <!-- 結算/失敗 Modal -->
    <div id="end-modal" class="modal hidden">
        <h1 id="end-title">挑戰結果</h1>
        <p id="end-msg" style="margin: 20px 0; font-size: 18px;"></p>
        <button class="btn-action" style="font-size: 18px;" onclick="restartGame()">重新挑戰</button>
    </div>
</div>

<script>
// 10 題真善美音樂題庫 [1]
const rawQuestions = [
    { q: "在音樂電影《真善美》中，哪一首經典歌曲巧妙地將音符唱名融入歌詞中？", ans: "多雷咪 (Do Re Mi)", wrong: ["野玫瑰", "鱒魚", "歡樂歌"] },
    { q: "音樂電影《真善美》中最經典的三首歌曲不包含下列哪一首？", ans: "歡唱人生", wrong: ["多雷咪 (Do Re Mi)", "小白花 (Edelweiss)", "寂寞的牧羊人 (The Lonely Goatherd)"] },
    { q: "在電影《真善美》中，男主角一邊彈吉他一邊溫柔演唱的〈小白花〉是哪一個國家的國花？", ans: "奧地利", wrong: ["英國", "美國", "日本"] },
    { q: "歌曲〈小白花〉(Edelweiss) 中提到的雪白純潔花朵生長在哪一座山脈上？", ans: "阿爾卑斯山", wrong: ["玉山", "富士山", "喜馬拉雅山"] },
    { q: "電影《真善美》中的經典歌曲〈寂寞的牧羊人〉在劇中搭配了哪一種表演形式呈現？", ans: "懸絲偶戲", wrong: ["羅漢戲獅", "戰颱風", "水上音樂"] },
    { q: "歌曲〈寂寞的牧羊人〉中，歌唱者快速反覆高低音的阿爾卑斯山區特殊唱腔稱作什麼？", ans: "約德爾唱法 (Yodeling)", wrong: ["聲樂唱法", "饒舌唱法", "京劇唱法"] },
    { q: "經典音樂電影《真善美》中的歌曲〈多雷咪〉與〈小白花〉是由哪一位音樂家作曲？", ans: "羅吉士", wrong: ["舒伯特", "貝多芬", "莫札特"] },
    { q: "在歌曲〈多雷咪〉(Do Re Mi) 的英語原詞中，將唱名「Doe (Do)」比喻成什麼？", ans: "母鹿 (a female deer)", wrong: ["金色的太陽 (golden sun)", "穿針引線的針 (a needle)", "果醬與麵包 (jam and bread)"] },
    { q: "在歌曲〈多雷咪〉(Do Re Mi) 的英語原詞中，歌詞「a drop of golden sun」對應到哪一個音符唱名？", ans: "Ray (Re)", wrong: ["Doe (Do)", "Me (Mi)", "Far (Fa)"] },
    { q: "在歌曲〈多雷咪〉(Do Re Mi) 的英語原詞中，「Tea, a drink with jam and bread」代表哪一個音符唱名？", ans: "Tea (Si)", wrong: ["Sew (Sol)", "La (La)", "Me (Mi)"] }
];

// 關卡怪物設定 (每關2題)
const stages = [
    { name: "野狼", img: "assets/characters/wolf.png" },
    { name: "毒蠍", img: "assets/characters/scorpion.png" },
    { name: "惡鬼", img: "assets/characters/demon.png" },
    { name: "巨龍", img: "assets/characters/dragon.png" },
    { name: "魔王", img: "assets/characters/boss.png" }
];

let currentStage = 0;
let currentQuestionIndex = 0;
let hp = 100;
let coins = 0;
let revives = 0;
let coinBonus = 20;
let shuffledQuestions = [];

function initGame() {
    hp = 100;
    coins = 0;
    revives = 0;
    currentStage = 0;
    currentQuestionIndex = 0;
    coinBonus = 20;
    shuffledQuestions = [...rawQuestions].sort(() => Math.random() - 0.5);
    document.getElementById("end-modal").classList.add("hidden");
    document.getElementById("shop-modal").classList.add("hidden");
    updateStats();
    loadStage();
}

function updateStats() {
    document.getElementById("hp-val").textContent = hp;
    document.getElementById("coin-val").textContent = coins;
    document.getElementById("revive-val").textContent = revives;
    document.getElementById("stage-num").textContent = currentStage + 1;
}

function loadStage() {
    const container = document.getElementById("game-container");
    container.style.backgroundImage = "url('assets/backgrounds/forest.jpg')";
    document.getElementById("monster-img").src = stages[currentStage].img;
    showQuestion();
}

function showQuestion() {
    updateStats();
    const qData = shuffledQuestions[currentQuestionIndex];
    document.getElementById("question-text").textContent = `【第 ${currentQuestionIndex + 1} 題】` + qData.q;
    
    // 混合選項並打亂
    const options = [qData.ans, ...qData.wrong].sort(() => Math.random() - 0.5);
    const grid = document.getElementById("options-grid");
    grid.innerHTML = "";
    
    options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt, qData.ans);
        grid.appendChild(btn);
    });
}

function checkAnswer(selected, correct) {
    if (selected === correct) {
        coins += coinBonus;
        alert(`🎉 答對了！魔法師發動攻擊，對 ${stages[currentStage].name} 造成傷害！獲得 ${coinBonus} 金幣。`);
    } else {
        hp -= 25;
        alert(`❌ 答錯了！正確答案是：【${correct}】\n魔法師受到攻擊扣除 25 HP！`);
        if (hp <= 0) {
            if (revives > 0) {
                revives--;
                hp = 50;
                alert("✨ 你使用了【復活符】，以 50 HP 重新站起！");
            } else {
                endGame(false);
                return;
            }
        }
    }

    currentQuestionIndex++;
    
    // 檢查是否完成該關卡（每 2 題算通過 1 關）
    if (currentQuestionIndex % 2 === 0) {
        if (currentStage < 4) {
            openShop();
        } else {
            endGame(true);
        }
    } else {
        showQuestion();
    }
}

function openShop() {
    const container = document.getElementById("game-container");
    container.style.backgroundImage = "url('assets/backgrounds/shop.jpg')";
    document.getElementById("shop-modal").classList.remove("hidden");
}

function buyItem(type) {
    if (type === 'potion') {
        if (coins >= 20) { coins -= 20; hp += 30; alert("喝下回血藥水，恢復 30 HP！"); }
        else { alert("金幣不足！"); }
    } else if (type === 'crystal') {
        if (coins >= 30) { coins -= 30; coinBonus += 10; alert("裝備攻擊水晶，答對獲取的金幣提升！"); }
        else { alert("金幣不足！"); }
    } else if (type === 'revive') {
        if (coins >= 50) { coins -= 50; revives += 1; alert("購買復活符成功！"); }
        else { alert("金幣不足！"); }
    }
    updateStats();
}

function nextStage() {
    document.getElementById("shop-modal").classList.add("hidden");
    currentStage++;
    loadStage();
}

function endGame(isWin) {
    const modal = document.getElementById("end-modal");
    const title = document.getElementById("end-title");
    const msg = document.getElementById("end-msg");
    modal.classList.remove("hidden");
    
    if (isWin) {
        title.textContent = "🏆 冒險通關成功！";
        msg.textContent = `太棒了！你順利擊敗了最終魔王！\n剩餘 HP: ${hp} | 累積金幣: ${coins}`;
    } else {
        title.textContent = "💀 冒險失敗";
        msg.textContent = `血量歸零，被 ${stages[currentStage].name} 擊敗了。再接再厲！`;
    }
}

function restartGame() {
    initGame();
}

// 啟動遊戲
initGame();
</script>
</body>
</html>
